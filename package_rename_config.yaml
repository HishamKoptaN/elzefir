  linux:
    app_name: "أسماك الزفر" # اسم التطبيق
    package_name: "net.elzefir.app" # اسم الحزمة
    exe_name: "elzefir" # اسم ملف التنفيذ

  macos:
    app_name: "أسماك الزفر" # اسم التطبيق
