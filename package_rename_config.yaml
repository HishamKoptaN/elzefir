    copyright_notice: "© 2024 elzefir" # حقوق الطبع والنشر (اختياري)

  web:
    app_name: "أسماك الزفر" # اسم التطبيق
    short_app_name: "أسماك الزفر" # اسم التطبيق المختصر (اختياري)
