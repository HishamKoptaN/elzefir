name: Check Firebase Service Account Secrets

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    
    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify FIREBASE_SERVICE_ACCOUNT existence in ${{ matrix.environment }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "Checking environment: ${{ matrix.environment }}"
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::❌ Error: FIREBASE_SERVICE_ACCOUNT is missing or empty in the '${{ matrix.environment }}' environment!"
            echo "Please add the service account JSON under Settings > Environments > ${{ matrix.environment }} > Environment secrets."
            exit 1
          else
            echo "✅ Success: FIREBASE_SERVICE_ACCOUNT is securely configured in the '${{ matrix.environment }}' environment."
          fi