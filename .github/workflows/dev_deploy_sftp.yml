name: Deploy Dev
on:
  push:
    branches:
      - dev
jobs:
  web-deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          architecture: x64
          cache: true
      - run: flutter pub get
      - run: |
          COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          flutter build web \
          --base-href "/alzefr/" \
          --dart-define=ENV=dev \
          --dart-define=COMMIT_MESSAGE="$COMMIT_MSG" \
          --release \
          --pwa-strategy=none
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - run: lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
          -p 21 "82.197.83.233" <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:max-retries 5
          set net:timeout 60
          mirror -R \
          --delete \
          --overwrite \
          ./build/web/ \
          /public_html/alzefr/
          quit
          EOF
