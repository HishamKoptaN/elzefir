name: Test FTP

on:
  push:
    branches:
      - dev

jobs:
  test-ftp:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "❌ FTP_USERNAME is empty"
            exit 1
          fi

          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ FTP_PASSWORD is empty"
            exit 1
          fi

          echo "✅ FTP secrets loaded successfully"

      - name: Test FTP Connection
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
          -p 21 "82.197.83.233" <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:max-retries 5
          set net:timeout 60

          pwd
          ls

          bye
          EOF
