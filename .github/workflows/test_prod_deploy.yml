name: Test SSH
on:
  push:
    branches:
      - devs
jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH Connection
        run: |
          - run: |
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
          -p 21 "82.197.83.233" <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:max-retries 5
          set net:timeout 60
          mirror -R \
            --delete \
            --overwrite \
            ./build/web/ \
            /public_html/alzefr/
          quit
          EOF
